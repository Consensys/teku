---
name: 'junit results'
description: 'Composite action to gather junit results'

inputs:
  stage_key:
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - name: Gather junit results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: ${{inputs.stage_key}}-reports-*
        path: reports/${{inputs.stage_key}}
        merge-multiple: true

    - shell: bash
      run: |
        ls -R reports/

    # Feeds timing-based shard planning (see planShards in matrix-tests-template.yml):
    # restore the last cached per-class timings, overlay this run's times on top (classes
    # missing from this run, e.g. a failed shard, keep their last known timing), and cache
    # the merged result under a fresh key for the next run to restore.
    - name: Restore previous test timings
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: test-timing-${{inputs.stage_key}}.json
        key: test-timing-${{inputs.stage_key}}-nonexistent
        restore-keys: |
          test-timing-${{inputs.stage_key}}-

    - name: Compute per-class test timings
      shell: bash
      env:
        STAGE_KEY: ${{inputs.stage_key}}
      run: |
        python3 <<'PY'
        import glob, json, os, xml.etree.ElementTree as ET

        stage = os.environ["STAGE_KEY"]
        timing_file = f"test-timing-{stage}.json"

        timings = {}
        if os.path.exists(timing_file):
            with open(timing_file) as f:
                timings = json.load(f)

        new_timings = {}
        for report in glob.glob(f"reports/{stage}/**/TEST-*.xml", recursive=True):
            try:
                root = ET.parse(report).getroot()
            except ET.ParseError:
                continue
            for testcase in root.findall("testcase"):
                classname = testcase.get("classname")
                if not classname:
                    continue
                new_timings[classname] = new_timings.get(classname, 0.0) + float(testcase.get("time") or 0)

        timings.update(new_timings)
        with open(timing_file, "w") as f:
            json.dump(timings, f)
        print(f"{len(new_timings)} classes timed this run, {len(timings)} total cached")
        PY

    - name: Cache test timings for next run's shard planning
      if: github.ref == 'refs/heads/master'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: test-timing-${{inputs.stage_key}}.json
        key: test-timing-${{inputs.stage_key}}-${{github.run_id}}

    # # https://github.com/dorny/test-reporter
    #v2
    - name: Junit Test Reporter
      uses: dorny/test-reporter@3d76b34a4535afbd0600d347b09a6ee5deb3ed7f
      env:
        NODE_OPTIONS: "--max_old_space_size=4096"      
      with:
        name: Combined ${{inputs.stage_key}} tests
        path: "reports/${{inputs.stage_key}}/**/TEST-*.xml"
        reporter: java-junit
        only-summary: 'false'
        list-tests: 'failed'
        list-suites: 'failed'
        use-actions-summary: 'true'
        # all/none/failed

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'

    # Convert JUnit XML to CTRF JSON
    - name: Convert JUnit to CTRF
      shell: bash
      run: |
        npm install -g junit-to-ctrf
        mkdir -p ./ctrf/${{inputs.stage_key}}/
        npx junit-to-ctrf 'reports/${{inputs.stage_key}}/**/TEST-*.xml' -o ./ctrf/${{inputs.stage_key}}/ctrf-report.json

    # Publish test report
    # v1
    - name: Publish Summary of Test Reports
      uses: ctrf-io/github-test-reporter@024bc4b64d997ca9da86833c6b9548c55c620e40
      with:
        report-path: './ctrf/${{inputs.stage_key}}/ctrf-report.json'
        # Disable PR interaction
        pull-request: false
        status-check: false
        update-comment: false
        overwrite-comment: true
        # generate reports
        suite-folded-report: false
        summary-report: true
        failed-report: true
        flaky-report: true
        # some aggregated analytics and trends (failures over time, etc)
        insights-report: true
        # Enables a full test report type — typically lists all tests and their statuses, not just failed.
        test-report: false
        previous-results-report: true
        max-previous-runs-to-fetch: 10
        report-order: 'summary-report,failed-report,flaky-report,insights-report,test-report'
      env:
        GITHUB_TOKEN: ${{ github.token }}
                
    - name: Upload CTRF artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ctrf-${{inputs.stage_key}}-tests
        path: ./ctrf/${{inputs.stage_key}}/ctrf-report.json 